<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Loader</title>
    <style>
        /* Light mode (default) */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: rgba(26, 26, 26, 0.2);
            --accent-color: #f43f5e;
        }

        /* Dark mode via data-theme attribute (synced from parent website) */
        :root[data-theme="dark"],
        html[data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: rgba(245, 245, 245, 0.2);
            --accent-color: #f43f5e;
        }

        /* Fallback: Dark mode via system preference (for standalone viewing) */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #0a0a0a;
                --bg-secondary: #1a1a1a;
                --text-primary: #f5f5f5;
                --text-secondary: rgba(245, 245, 245, 0.2);
                --accent-color: #f43f5e;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Oswald", "Bebas Neue", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-primary);
            overflow: hidden;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .text {
            display: flex;
            font-size: 6.5rem;
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .text {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 480px) {
            .text {
                font-size: 2.5rem;
            }
        }

        .text span {
            display: inline-block;
            position: relative;
            color: var(--text-secondary);
            line-height: 1;
            transform: translateY(100px);
            --clipPath: inset(100% 0 0 0);
        }

        .text span::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: var(--accent-color);
            clip-path: var(--clipPath);
            -webkit-clip-path: var(--clipPath);
            transition: clip-path 0s;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
    <div class="loader">
        <div class="text">
            <span data-text="S">S</span>
            <span data-text="H">H</span>
            <span data-text="R">R</span>
            <span data-text="I">I</span>
            <span data-text="D">D</span>
            <span data-text="S">S</span>
            <span data-text="T">T</span>
            <span data-text="U">U</span>
            <span data-text="D">D</span>
            <span data-text="I">I</span>
            <span data-text="O">O</span>
            <span data-text="S">S</span>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const letters = document.querySelectorAll(".text span");
            const tl = gsap.timeline();
            tl.to(letters, {
                duration: 0.6,
                y: 0,
                stagger: 0.05,
                ease: "power2.out",
            })
                .to(letters, {
                    "--clipPath": "inset(0% 0 0 0)",
                    duration: 0.8,
                    delay: 0.3,
                    ease: "power1.inOut",
                })
                .to(letters, {
                    duration: 0.6,
                    y: 100,
                    stagger: 0.05,
                    delay: 0.5,
                });
        });
    </script>
</body>

</html>
