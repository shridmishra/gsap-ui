<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar String</title>
  <style>
    :root {
      --bg-primary: #f7f7f7;
      --bg-secondary: #ececec;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border-color: #d7d7d7;
      --accent-color: #2563eb;
      --string-color: #111111;
    }

    :root[data-theme="dark"],
    html[data-theme="dark"] {
      --bg-primary: #0f0f10;
      --bg-secondary: #1b1b1d;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --border-color: #2f2f33;
      --accent-color: #60a5fa;
      --string-color: #f5f5f5;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f0f10;
        --bg-secondary: #1b1b1d;
        --text-primary: #f5f5f5;
        --text-secondary: #a0a0a0;
        --border-color: #2f2f33;
        --accent-color: #60a5fa;
        --string-color: #f5f5f5;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: sans-serif;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, var(--bg-secondary), var(--bg-primary));
      color: var(--text-primary);
      overflow: hidden;
      padding: 2rem;
    }

    .string {
      width: min(1000px, 100%);
      height: 500px;
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      background: color-mix(in srgb, var(--bg-secondary) 70%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      position: relative;
    }

    .label {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    svg {
      width: min(1000px, 96%);
      height: 180px;
      overflow: visible;
    }

    path {
      stroke: var(--string-color);
      stroke-width: 2;
      fill: transparent;
    }
  </style>
</head>
<body>
  <div class="string">
    <p class="label">Drag across the string</p>
    <svg viewBox="0 0 1000 300" aria-label="Guitar string animation">
      <path d="M 10 100 Q 500 100 990 100"></path>
    </svg>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      let path = "M 10 100 Q 500 100 990 100";
      const finalPath = "M 10 100 Q 500 100 990 100";
      const string = document.querySelector(".string");

      string.addEventListener("mousemove", (event) => {
        const bounds = string.getBoundingClientRect();
        const x = ((event.clientX - bounds.left) / bounds.width) * 1000;
        const y = ((event.clientY - bounds.top) / bounds.height) * 300;

        path = `M 10 100 Q ${x} ${y} 990 100`;

        gsap.to("svg path", {
          attr: { d: path },
          duration: 0.3,
          ease: "power3.out",
        });
      });

      string.addEventListener("mouseleave", () => {
        gsap.to("svg path", {
          attr: { d: finalPath },
          duration: 1.5,
          ease: "elastic.out(1,0.2)",
        });
      });
    });
  </script>
</body>
</html>
