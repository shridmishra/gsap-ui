<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View More Mouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f6f6f6;
      --bg-secondary: #ededed;
      --text-primary: #1a1a1a;
      --text-secondary: #5f5f5f;
      --border-color: #d8d8d8;
      --accent-color: #3b82f6;
      --cursor-bg: #ffffff;
      --cursor-hover-bg: #ffffff8a;
      --cursor-text: #111111;
      --image-shadow: #00000033;
    }

    :root[data-theme="dark"],
    html[data-theme="dark"] {
      --bg-primary: #0f0f10;
      --bg-secondary: #1a1a1c;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --border-color: #313136;
      --accent-color: #60a5fa;
      --cursor-bg: #f5f5f5;
      --cursor-hover-bg: #f5f5f58a;
      --cursor-text: #111111;
      --image-shadow: #00000052;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f0f10;
        --bg-secondary: #1a1a1c;
        --text-primary: #f5f5f5;
        --text-secondary: #a0a0a0;
        --border-color: #313136;
        --accent-color: #60a5fa;
        --cursor-bg: #f5f5f5;
        --cursor-hover-bg: #f5f5f5;
        --cursor-text: #111111;
        --image-shadow: #00000052;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    .main {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 25% 20%, var(--bg-secondary), var(--bg-primary));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .cursor {
      width: 20px;
      height: 20px;
      background: var(--cursor-bg);
      color: var(--cursor-text);
      border-radius: 9999px;
      position: fixed;
      font-size: 0.25rem;
      font-weight: 450;
      letter-spacing: 0.03em;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 99;
      pointer-events: none;
      transform: translate(-50%, -50%);
      text-transform: uppercase;
    }

    .image {
      width: min(40vw, 540px);
      height: min(62vw, 400px);
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 60px var(--image-shadow);
    }

    .image img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      background: transparent;
      height: 100%;
      width: 100%;
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .image {
        width: 92vw;
        height: 58vw;
      }
    }
  </style>
</head>

<body>
  <div class="cursor"></div>

  <div class="main">
    <div class="image">
      <div class="overlay"></div>
      <img src="/assets/stock/Solitude Amidst Grandeur.png" alt="Landscape preview" />
    </div>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
    integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const main = document.querySelector(".main");
      const cursor = document.querySelector(".cursor");
      const imageDiv = document.querySelector(".image");

      main.addEventListener("mousemove", (event) => {
        gsap.to(cursor, {
          x: event.clientX,
          y: event.clientY,
          duration: 0.45,
          ease: "power3.out",
        });
      });

      imageDiv.addEventListener("mouseenter", () => {
        cursor.textContent = "VIEW MORE";
        gsap.to(cursor, {
          scale: 4,
          backgroundColor: "var(--cursor-hover-bg)",
          duration: 0.25,
          ease: "power2.out",
        });
      });

      imageDiv.addEventListener("mouseleave", () => {
        cursor.textContent = "";
        gsap.to(cursor, {
          scale: 1,
          backgroundColor: "var(--cursor-bg)",
          duration: 0.25,
          ease: "power2.out",
        });
      });
    });
  </script>
</body>

</html>
