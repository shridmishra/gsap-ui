<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Mouse Image Trail</title>
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <style>
        /* Dark/Light Mode CSS Variables */
        /* Light mode (default) */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e2e2e2;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        /* Dark mode via data-theme attribute (injected by parent) */
        :root[data-theme="dark"],
        html[data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --shadow-color: rgba(255, 255, 255, 0.05);
        }

        /* Fallback: Dark mode via system preference (for standalone viewing) */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #0a0a0a;
                --bg-secondary: #1a1a1a;
                --shadow-color: rgba(255, 255, 255, 0.05);
            }
        }

        /* Reset & base layout */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .img {
            position: absolute;
            width: 100px;
            height: 150px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 10px;
            box-shadow: 0 2px 10px var(--shadow-color);
        }
    </style>
</head>

<body>
    <div class="img">
        <img src="/assets/stock/Ethereal Cavern Scene.png">
    </div>
    <div class="img">
        <img src="/assets/stock/Ethereal Motion Scene.png">
    </div>
    <div class="img">
        <img src="/assets/stock/Floral Fusion Figure.png">
    </div>
    <div class="img">
        <img src="/assets/stock/Mystical Portal Landscape.png">
    </div>

    <div class="img">
        <img src="/assets/stock/Pastoral Monolith Scene.png">
    </div>

    <div class="img">
        <img src="/assets/stock/Serene Daisy Meadow.png">
    </div>

    <div class="img">
        <img src="/assets/stock/Serene Green Hills.png">
    </div>

    <div class="img">
        <img src="/assets/stock/Serene Landscape of Rolling Hills.png">
    </div>

    <div class="img">
        <img src="/assets/stock/Solitude Amidst Grandeur.png">
    </div>

    <script>
        document.addEventListener('mousemove', e => {
            gsap.to(".img", {
                x: e.clientX,
                y: e.clientY,
                stagger: -0.1,
            });


        })

    </script>
</body>

</html>
